services:

  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: trading-platform-db

    environment:
      POSTGRES_DB: ${DB_NAME:-trading_platform}
      POSTGRES_USER: ${DB_USERNAME:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/01-init.sql

    networks:
      - trading-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U trading_user -d trading_platform"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: trading-platform-cache

    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - trading-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ========================================
  # Spring Boot Backend
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: trading-platform-backend

    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-trading_platform}}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-trading_platform}
      DB_USERNAME: ${DB_USERNAME:-trading_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_CLIENT_ID: ${UPSTOX_CLIENT_ID:-}
      UPSTOX_CLIENT_SECRET: ${UPSTOX_CLIENT_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}

    ports:
      - "8080:8080"

    volumes:
      - ./data/global.json.gz:/app/data/global.json.gz:ro
      - ./data/complete.json.gz:/app/data/complete.json.gz:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - trading-network

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/api/v1/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # ========================================
  # React frontend
  # ========================================
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile

  #   container_name: trading-platform-frontend

  #   ports:
  #     - "5173:80"

  #   depends_on:
  #     backend:
  #       condition: service_healthy

  #   networks:
  #     - trading-network

# ========================================
# Named Volumes
# ========================================
volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local


# ========================================
# Network
# ========================================
networks:
  trading-network:
    driver: bridge
